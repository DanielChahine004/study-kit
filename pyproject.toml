[project]
name = "study-kit"
version = "1.2.0"
description = "What every writeup shares: writing rules, figure style and checks, sources checker, Overleaf sync, and their tests"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.7", "numpy", "pytest"]

[project.entry-points.pytest11]
studykit = "studykit.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studykit"]
